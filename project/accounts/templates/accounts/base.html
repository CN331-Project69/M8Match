<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}M8Match{% endblock %}</title>
    
    <!-- ดึง Bootstrap 5 CSS ผ่าน CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- แถบเมนูด้านบน (Navbar) พื้นฐาน -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">M8Match</a>
        </div>
    </nav>

    <!-- รูโหว่ตรงนี้ (block content) คือจุดที่หน้าอื่นๆ จะเอาโค้ดมาเสียบ -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- ดึง Bootstrap 5 JS ผ่าน CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
