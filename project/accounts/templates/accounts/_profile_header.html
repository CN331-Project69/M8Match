{# ส่วนหัวของหน้าโปรไฟล์: โลโก้ + เมนู ใช้ร่วมกันระหว่างหน้าดูและหน้าแก้ไข #}
<header class="profile-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <a href="{% url 'home' %}" class="text-decoration-none">
        <span class="brand-logo profile-logo">M8Match</span>
    </a>
    <nav class="d-flex flex-wrap align-items-center gap-3" aria-label="Main">
        <a href="{% url 'find_match' %}" class="btn btn-m8 btn-m8-sm btn-m8-register">Match</a>
        <a href="{% url 'board:board' %}" class="btn btn-m8 btn-m8-sm btn-m8-register">Board</a>
        <a href="{% url 'chat:inbox' %}" class="btn btn-m8 btn-m8-sm btn-m8-register">Chat</a>
        <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-m8 btn-m8-sm btn-m8-login">Log Out</button>
        </form>
    </nav>
</header>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} profile-alert py-2">{{ message }}</div>
    {% endfor %}
{% endif %}
